<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="#inicio" aria-label="Aurêva - início" (click)="selectSection('inicio')">
      <span class="brand-mark">A</span>
      <span class="brand-copy"><strong>AURÊVA</strong><small>CLÍNICA DE ESTÉTICA AVANÇADA</small></span>
    </a>

    <nav id="main-navigation" class="main-nav" [class.mobile-open]="isMenuOpen" aria-label="Navegação principal">
      @for (item of navigation; track item.id) {
        <a
          [class.active]="activeSection === item.id"
          [attr.aria-current]="activeSection === item.id ? 'page' : null"
          [href]="'#' + item.id"
          (click)="selectSection(item.id)"
        >
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="header-actions">
      <button class="outline-btn header-btn" type="button" (click)="bookingRequested.emit(); isMenuOpen = false">
        <span>▣</span> Agende sua avaliação
      </button>
      <button
        class="menu-toggle"
        type="button"
        [attr.aria-expanded]="isMenuOpen"
        aria-controls="main-navigation"
        aria-label="Abrir menu"
        (click)="toggleMenu()"
      >
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>
