@if (applicationError.hasError()) {

  <!-- SOMENTE A TELA DE ERRO -->
  <app-error-page
    (retryConnection)="retryConnection()"
  />

} @else {

  <!-- TODO O SITE NORMAL -->
  <app-site-header
    (bookingRequested)="openBooking()"
  />

  <main>

    <app-hero
      (bookingRequested)="openBooking()"
    />

    <!-- INAUGURAÇÃO -->
    <section
      class="inauguration"
      id="inauguracao"
      aria-labelledby="inauguration-title"
    >

      <!-- conteúdo da inauguração -->

    </section>

    <app-services
      (bookingRequested)="openBooking($event)"
    />

    <app-why-us />
    <app-team></app-team>
    <app-testimonials />

    <app-booking-cta
      (bookingRequested)="openBooking()"
    />

    <app-contact />

  </main>

  @if (isBookingOpen) {
    <app-booking-modal
      [selectedService]="selectedService"
      (closed)="closeBooking()"
    />
  }

  <app-site-footer />

  <app-floating-socials />

}
